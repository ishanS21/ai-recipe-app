<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Recipe Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>AI Recipe Finder</h1>

    <form id="recipeForm">
        <input
            type="text"
            id="ingredients"
            placeholder="Enter ingredients (comma separated)"
            required
        >

        <div class="radio-group">
            <label>
                <input type="radio" name="type" value="veg" checked>
                Veg
            </label>
            <label>
                <input type="radio" name="type" value="non-veg">
                Non-Veg
            </label>
        </div>

        <button type="submit">Find Recipes</button>
    </form>

    <div id="results"></div>
</div>

<script src="script.js"></script>
</body>
</html>
